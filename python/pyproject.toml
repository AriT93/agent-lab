[project]
name = "agent-lab-langgraph"
version = "0.1.0"
description = "Stage 8: the joke agent as a LangGraph graph, served by the LangGraph dev server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
    "pytest>=9.1.1",
]
